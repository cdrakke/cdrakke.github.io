name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  # Puppeteer is a dev dependency for local OG/resume renders only; CI never runs a browser.
  PUPPETEER_SKIP_DOWNLOAD: "true"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Installs, runs `astro build`, and uploads dist/ as the Pages artifact.
      # The OG image and resume PDF are committed (public/og.png, public/resume/*.pdf),
      # so CI does not need a browser.
      - name: Install, build, and upload
        uses: withastro/action@v6
        with:
          node-version: 22
          package-manager: npm@latest
          build-cmd: npx astro build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
